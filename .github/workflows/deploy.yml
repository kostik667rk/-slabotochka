name: Publish Slabotochka

on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack the app
        run: |
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test -f _site/apple-touch-icon.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
